  <rect width="512" height="512" fill="url(#night)"/>
  <circle cx="256" cy="246" r="206" fill="url(#glow)"/>
  <circle cx="250" cy="256" r="160" fill="url(#moon)" mask="url(#crescent)"/>
  <circle cx="154" cy="132" r="4" fill="#FFF5F0" opacity=".86"/>
  <circle cx="356" cy="330" r="3" fill="#E8C58A" opacity=".8"/>
  <circle cx="392" cy="156" r="2.5" fill="#FFD6E7" opacity=".76"/>
