<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="night" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#301020"/>
      <stop offset="1" stop-color="#08070C"/>
    </radialGradient>
    <linearGradient id="moon" x1=".2" y1=".1" x2=".82" y2=".95">
      <stop offset="0" stop-color="#FFF5F0"/>
      <stop offset=".46" stop-color="#FFD6E7"/>
      <stop offset="1" stop-color="#E8C58A"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F18AB8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#F18AB8" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent" x="0" y="0" width="512" height="512" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="250" cy="256" r="160" fill="#fff"/>
      <circle cx="342" cy="187" r="154" fill="#000"/>
    </mask>
