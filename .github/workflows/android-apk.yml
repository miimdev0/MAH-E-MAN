name: Build MAH-E MAN Android APK

on:
  push:
    branches:
      - main
      - arena/71892375-mah-e-man
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android 16 SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Stage the website, fonts, icons, and optional audio
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www/font www/assets/icons www/audio
          cp index.html style.css site.webmanifest www/
          cp assets/icon.svg www/assets/icon.svg
          cp assets/icons/icon-192.png assets/icons/icon-512.png www/assets/icons/
          cp -R font/. www/font/
          rm -f www/font/.gitkeep
          for asset in audio/*; do
            [[ -f "$asset" ]] || continue
            case "$(basename "$asset")" in .gitkeep|README.md) continue ;; esac
            cp "$asset" www/audio/
          done
          npx esbuild script.js --bundle --format=iife --platform=browser --target=es2022 --outfile=www/script.js
          test -f www/index.html
          test -f www/font/vazirmatn-arabic-wght-normal.woff2
          test -f www/assets/icons/icon-512.png

      - name: Generate the Android project
        run: npx cap add android

      - name: Sync the web app and local notifications plugin
        run: npx cap sync android

      - name: Apply the MAH-E MAN Android launcher and notification icons
        shell: bash
        run: |
          set -euo pipefail
          cp -R assets/android/. android/app/src/main/res/
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/drawable/ic_notification_moon.xml

      - name: Build the installable debug APK
        working-directory: android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: MAH-E-MAN-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
