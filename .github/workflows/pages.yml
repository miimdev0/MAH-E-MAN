name: Build and deploy MAH-E MAN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install the web bundle dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble the static site
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f style.css
          test -f script.js
          test -f site.webmanifest
          test -f assets/icon.svg
          test -f assets/icons/icon-192.png
          test -f assets/icons/icon-512.png
          test -f font/vazirmatn-arabic-wght-normal.woff2
          test -f font/OFL.txt
          test -d www/font
          test -d audio
          rm -rf _site
          mkdir -p _site/font _site/assets/icons _site/audio
          cp index.html style.css site.webmanifest _site/
          cp assets/icon.svg _site/assets/
          cp assets/icons/icon-192.png assets/icons/icon-512.png _site/assets/icons/
          cp -R font/. _site/font/
          for asset in www/font/*; do
            [[ -f "$asset" ]] || continue
            [[ "$(basename "$asset")" == ".gitkeep" ]] && continue
            [[ -e "_site/font/$(basename "$asset")" ]] && continue
            cp "$asset" _site/font/
          done
          for asset in audio/*; do
            [[ -f "$asset" ]] || continue
            case "$(basename "$asset")" in .gitkeep|README.md) continue ;; esac
            cp "$asset" _site/audio/
          done
          npx esbuild script.js --bundle --format=iife --platform=browser --target=es2022 --outfile=_site/script.js

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
