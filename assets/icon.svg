<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ماه من</title>
  <desc id="desc">هلالی از نور، قلبی کوچک و ستاره‌هایی در آسمان شب.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100914"/>
      <stop offset=".54" stop-color="#1d0b1a"/>
      <stop offset="1" stop-color="#08070c"/>
    </linearGradient>
    <radialGradient id="aura" cx="46%" cy="51%" r="55%">
      <stop offset="0" stop-color="#b44277" stop-opacity=".38"/>
      <stop offset=".52" stop-color="#662346" stop-opacity=".19"/>
      <stop offset="1" stop-color="#180b19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1=".16" y1=".13" x2=".82" y2=".9">
      <stop offset="0" stop-color="#fff9f2"/>
      <stop offset=".42" stop-color="#ffd9e8"/>
      <stop offset=".78" stop-color="#f1a7c5"/>
      <stop offset="1" stop-color="#e8c58a"/>
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4ed"/>
      <stop offset=".55" stop-color="#f18ab8"/>
      <stop offset="1" stop-color="#bd547d"/>
    </linearGradient>
    <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="crescent" x="0" y="0" width="512" height="512" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="#000"/>
      <circle cx="230" cy="263" r="158" fill="#fff"/>
      <circle cx="325" cy="185" r="151" fill="#000"/>
    </mask>
    <mask id="heart-cutout" x="0" y="0" width="512" height="512" maskUnits="userSpaceOnUse">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="325" cy="185" r="151" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#night)"/>
  <circle cx="256" cy="252" r="242" fill="url(#aura)"/>
  <ellipse cx="256" cy="261" rx="188" ry="203" fill="none" stroke="#e8c58a" stroke-opacity=".15" stroke-width="1.4" transform="rotate(-24 256 261)"/>
  <circle cx="230" cy="263" r="158" fill="url(#moon)" mask="url(#crescent)"/>
  <path d="M219 313c-8-9-23-4-23 9 0 15 25 28 25 28s25-13 25-28c0-13-15-18-23-9l-2 3-2-3Z" fill="url(#heart)" filter="url(#soft-glow)" mask="url(#heart-cutout)"/>
  <path d="M371 109c2 10 6 14 16 16-10 2-14 6-16 16-2-10-6-14-16-16 10-2 14-6 16-16Z" fill="#fff5e8"/>
  <path d="M132 198c1.4 6.4 4.1 9.1 10.5 10.5-6.4 1.4-9.1 4.1-10.5 10.5-1.4-6.4-4.1-9.1-10.5-10.5 6.4-1.4 9.1-4.1 10.5-10.5Z" fill="#f18ab8" opacity=".9"/>
  <path d="M385 329c1.2 5.6 3.4 7.8 9 9-5.6 1.2-7.8 3.4-9 9-1.2-5.6-3.4-7.8-9-9 5.6-1.2 7.8-3.4 9-9Z" fill="#e8c58a" opacity=".95"/>
  <circle cx="407" cy="221" r="2.4" fill="#fff4ed" opacity=".9"/>
  <circle cx="160" cy="355" r="2.8" fill="#e8c58a" opacity=".8"/>
  <circle cx="293" cy="88" r="2" fill="#ffd9e8" opacity=".8"/>
</svg>
